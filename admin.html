<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noelia's Helados | Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍦</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

  <!-- Header Admin -->
  <header class="bg-gray-900 text-white py-4 px-8 flex justify-between items-center shadow-lg">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">📊</span>
      <h1 class="text-xl font-bold">Panel Admin — Noelia's Helados</h1>
    </div>
    <div class="flex items-center space-x-4">
      <button onclick="cargarPedidos()" class="bg-pink-600 hover:bg-pink-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition">
        🔄 Actualizar Pedidos
      </button>
      <button onclick="cerrarSesion()" class="bg-red-500 hover:bg-red-600 text-white text-xs font-semibold px-3 py-2 rounded-lg transition">
        Cerrar Sesión
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-7xl mx-auto py-10 px-6">
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-2xl font-bold text-gray-700">Pedidos de Clientes en Tiempo Real</h2>
      <span class="bg-green-100 text-green-700 font-medium text-xs px-3 py-1 rounded-full">● Conectado a Supabase</span>
    </div>

    <!-- Tarjetas de Estadísticas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
        <p class="text-xs text-gray-400 font-bold uppercase">Total Acumulado</p>
        <h3 id="stat-ventas" class="text-3xl font-extrabold text-pink-600 mt-2">$0 MXN</h3>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
        <p class="text-xs text-gray-400 font-bold uppercase">Pedidos Recibidos</p>
        <h3 id="stat-pedidos" class="text-3xl font-extrabold text-blue-600 mt-2">0</h3>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
        <p class="text-xs text-gray-400 font-bold uppercase">Estado del Sistema</p>
        <h3 class="text-xl font-bold text-green-600 mt-2">Recibiendo carritos</h3>
      </div>
    </div>

    <!-- Tabla de Pedidos -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-6 border-b border-gray-100">
        <h3 class="text-lg font-bold text-gray-800">Lista de Carritos Confirmados</h3>
      </div>
      <table class="w-full text-left text-sm text-gray-600">
        <thead class="bg-gray-50 text-xs text-gray-400 uppercase">
          <tr>
            <th class="py-3 px-6">ID Pedido</th>
            <th class="py-3 px-6">Cliente</th>
            <th class="py-3 px-6">Productos</th>
            <th class="py-3 px-6">Total</th>
            <th class="py-3 px-6">Estado</th>
          </tr>
        </thead>
        <tbody id="pedidos-tabla" class="divide-y divide-gray-100">
          <tr>
            <td colspan="5" class="py-6 text-center text-gray-400 text-xs">Cargando pedidos de la base de datos...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://gyldwyadpgxtmtclfdbx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5bGR3eWFkcGd4dG10Y2xmZGJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNDM5NTksImV4cCI6MjEwMjgxOTk1OX0.K9bLLXQsHvJhpubWJgnXPVs_KZW6paGqco81eTObbnY'; // Pegar tu clave anon aquí
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function cargarPedidos() {
      const tbody = document.getElementById('pedidos-tabla');
      
      const { data: pedidos, error } = await client
        .from('pedidos')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-red-500">Error: ${error.message}</td></tr>`;
        return;
      }

      if (pedidos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-gray-400">Aún no hay pedidos registrados.</td></tr>`;
        document.getElementById('stat-ventas').innerText = '$0 MXN';
        document.getElementById('stat-pedidos').innerText = '0';
        return;
      }

      tbody.innerHTML = '';
      let totalVentas = 0;

      pedidos.forEach(p => {
        totalVentas += Number(p.total || 0);

        tbody.innerHTML += `
          <tr>
            <td class="py-4 px-6 font-mono font-bold text-pink-600">#RES-${p.id}</td>
            <td class="py-4 px-6">
              <div class="font-bold text-gray-800">${p.cliente_nombre}</div>
              <div class="text-xs text-gray-400">📱 ${p.cliente_telefono}</div>
            </td>
            <td class="py-4 px-6 text-gray-700">${p.productos}</td>
            <td class="py-4 px-6 font-bold text-gray-800">$${p.total} MXN</td>
            <td class="py-4 px-6">
              <span class="bg-amber-100 text-amber-700 px-2.5 py-1 rounded-full text-xs font-semibold">${p.estado}</span>
            </td>
          </tr>
        `;
      });

      document.getElementById('stat-ventas').innerText = `$${totalVentas} MXN`;
      document.getElementById('stat-pedidos').innerText = pedidos.length;
    }

    async function cerrarSesion() {
      await client.auth.signOut();
      window.location.href = 'login.html';
    }

    // Cargar automáticamente al abrir la página
    window.onload = cargarPedidos;
  </script>

</body>
</html>
