<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noelia's Helados | Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍦</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-pink-100 via-rose-50 to-amber-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full border border-pink-100">
    <div class="text-center mb-8">
      <span class="text-5xl inline-block mb-2">🔑</span>
      <h2 class="text-2xl font-bold text-gray-800">Panel de Administración</h2>
      <p class="text-sm text-gray-500 mt-1">Ingresa tus credenciales para acceder</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Correo Electrónico</label>
        <input type="email" id="email" placeholder="admin@ejemplo.com" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>

      <p id="error-msg" class="text-xs text-red-500 font-medium hidden text-center"></p>

      <button onclick="iniciarSesion()" id="btn-login" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-xl shadow-lg transition duration-300">
        Entrar al Sistema
      </button>

      <div class="text-center mt-4">
        <a href="index.html" class="text-xs text-pink-500 hover:underline">← Volver al sitio público</a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gyldwyadpgxtmtclfdbx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5bGR3eWFkcGd4dG10Y2xmZGJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNDM5NTksImV4cCI6MjEwMjgxOTk1OX0.K9bLLXQsHvJhpubWJgnXPVs_KZW6paGqco81eTObbnY'; // Pega tu clave de Supabase aquí
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function iniciarSesion() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      const btn = document.getElementById('btn-login');

      errorMsg.classList.add('hidden');
      btn.disabled = true;
      btn.innerText = '⏳ Verificando...';

      const { data, error } = await client.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.innerText = '⚠️ Credenciales incorrectas o error de conexión.';
        errorMsg.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = 'Entrar al Sistema';
      } else {
        window.location.href = 'admin.html';
      }
    }
  </script>

</body>
</html>
